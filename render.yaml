# Render Blueprint. Secrets marked sync:false must be entered in the Render dashboard.
databases:
  - name: creatorpulse-db
    plan: free
    databaseName: creatorpulse

services:
  - type: web
    name: creatorpulse-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy || npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, fromDatabase: { name: creatorpulse-db, property: connectionString } }
      - { key: FRONTEND_URL, sync: false }
      - { key: GOOGLE_REDIRECT_URI, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: ENCRYPTION_SECRET, generateValue: true }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GEMINI_MODEL, value: gemini-2.5-flash }
      - { key: ENABLE_INLINE_WORKER, value: "true" }

  - type: web
    name: creatorpulse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - { key: VITE_API_URL, sync: false }

  # Optional paid worker. If you use it, set ENABLE_INLINE_WORKER=false on the API.
  # - type: worker
  #   name: creatorpulse-worker
  #   runtime: node
  #   rootDir: backend
  #   buildCommand: npm install && npx prisma generate
  #   startCommand: npm run worker
  #   envVars: (same as the API service)
