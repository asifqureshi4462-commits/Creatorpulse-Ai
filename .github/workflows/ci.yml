name: CreatorPulse AI CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build-and-validate:
    name: Build Frontend & Validate Backend
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # --- FRONTEND BUILD ---
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Vite Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      # --- BACKEND VALIDATION ---
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Validate Backend Build & Scripts
        working-directory: ./backend
        run: |
          echo "Verifying backend server syntax and configuration..."
          node -c src/server.js
          echo "Backend validation successful!"