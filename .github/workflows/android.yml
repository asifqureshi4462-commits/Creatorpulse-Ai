name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Show toolchain versions
        run: |
          node -v
          npm -v
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Require the public backend URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Repository variable VITE_API_URL is empty. The APK needs the public https URL of your backend (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          case "$VITE_API_URL" in https://*) ;; *) echo "::error::VITE_API_URL must start with https://"; exit 1;; esac

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Build web app (Vite)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Generate Android project
        run: |
          npx cap add android
          test -f android/app/src/main/AndroidManifest.xml

      - name: Register creatorpulse://auth deep link (Google sign-in return)
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if 'android:scheme="creatorpulse"' in s:
              print("Deep link already present")
          else:
              block = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="creatorpulse" android:host="auth" />
                  </intent-filter>
              '''
              s = s.replace("</activity>", block + "</activity>", 1)
              open(p, "w", encoding="utf-8").write(s)
          assert 'android:scheme="creatorpulse"' in open(p, encoding="utf-8").read(), "deep link was not added"
          print("Deep link registered")
          PY
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || { echo "::error::INTERNET permission missing"; exit 1; }

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: creatorpulse-ai-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
